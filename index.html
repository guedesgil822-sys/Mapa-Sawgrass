<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rota no Shopping · Sawgrass Mills</title>
<meta name="description" content="Rotas a pé entre lojas do Sawgrass Mills (Sunrise, Flórida).">
<meta name="theme-color" content="#14233b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
<main id="map" aria-label="Mapa do piso"></main>
<div id="markers" aria-hidden="true"></div>

<header class="top">
  <div class="card trip">
    <div class="rail" aria-hidden="true"><i class="dot from"></i><i class="line"></i><i class="dot to"></i></div>
    <div class="fields">
      <button type="button" class="field" id="f-from"><small>Você está em</small><span>Escolha a loja mais próxima</span></button>
      <button type="button" class="field" id="f-to"><small>Quer ir para</small><span>Escolha o destino</span></button>
    </div>
    <button type="button" class="icon-btn" id="swap" aria-label="Inverter origem e destino" title="Inverter">⇅</button>
  </div>
  <div class="opts">
    <button type="button" class="chip find" id="find">🔎 Buscar loja</button>
    <label class="chip toggle"><input type="checkbox" id="accessible"><span>♿ Sem escada rolante</span></label>
    <button type="button" class="chip marked" id="marked-chip" hidden></button>
    <button type="button" class="chip" id="marked-clear" hidden>✕ Limpar</button>
    <a class="chip open-web" id="open-web" hidden href="https://guedesgil822-sys.github.io/Mapa-Sawgrass/" target="_blank" rel="noopener">🌐 Abrir no navegador</a>
    <span class="chip warn" id="draft-flag" hidden>Rascunho do editor</span>
  </div>
  <div class="card gps-bar" id="gps-bar" hidden role="status">
    <span class="gps-txt" id="gps-txt"></span>
    <button type="button" class="chip" id="gps-use" hidden>Usar como origem</button>
    <button type="button" class="icon-btn" id="gps-close" aria-label="Desligar localização">✕</button>
  </div>
</header>

<nav id="floors" aria-label="Pisos"></nav>
<div class="zoom">
  <button type="button" id="gps" aria-label="Onde estou (GPS)" title="Onde estou (GPS)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 1.5v3.5M12 19v3.5M1.5 12h3.5M19 12h3.5"/></svg></button>
  <button type="button" id="zin" aria-label="Aproximar">+</button>
  <button type="button" id="zout" aria-label="Afastar">−</button>
</div>

<section id="sheet" hidden aria-live="polite"></section>

<dialog id="picker">
  <form method="dialog" class="picker-head">
    <button class="icon-btn" value="cancel" aria-label="Fechar">←</button>
    <input type="search" id="q" placeholder="Buscar loja ou serviço" autocomplete="off" enterkeyhint="search">
  </form>
  <div class="chips" id="groups"></div>
  <p class="mark-hint" id="mark-hint" hidden>Toque nas lojas para marcar ou desmarcar.</p>
  <ul id="results"></ul>
  <div class="mark-bar" id="mark-bar" hidden>
    <button type="button" class="btn" id="mark-clear">Limpar</button>
    <button type="button" class="btn primary" id="mark-show">Ver no mapa</button>
  </div>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
